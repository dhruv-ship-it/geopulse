version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: geopulse-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: geopulse-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis:
    image: redis:7.2-alpine
    container_name: geopulse-redis
    ports:
      # 6390, not the 6380 this project used to ask for: an unrelated project's Redis owns 6380
      # on the dev machine. Moving the port alone would only relocate the collision, so the
      # password below is the actual guard — a service that reaches the wrong Redis now fails
      # AUTH instead of silently reading and writing another project's data.
      - "6390:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-geopulse-dev}

  postgres:
    image: postgres:16-alpine
    container_name: geopulse-postgres
    ports:
      # 5433 for the same reason as Redis above: 5432 is taken by another project locally.
      - "5433:5432"
    environment:
      POSTGRES_USER: geopulse
      POSTGRES_PASSWORD: geopulse
      POSTGRES_DB: geopulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../services/alert-processor/migrations:/docker-entrypoint-initdb.d

volumes:
  postgres_data:
